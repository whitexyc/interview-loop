<svg viewBox="0 0 680 436" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="24" font-size="14" font-weight="500" fill="#2C2C2A">记忆生命周期 — 现状（实线）与可设计机制（虚线）</text>
<rect x="250" y="40" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="62" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">对话结束</text>
<path d="M290 84 L290 108" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#c)"/>
<path d="M390 84 L390 108" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#c)"/>
<text x="255" y="100" font-size="11" fill="#5F5E5A">非重要</text>
<text x="405" y="100" font-size="11" fill="#5F5E5A">importance≥0.6</text>
<rect x="40" y="112" width="240" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="52" y="132" font-size="13" font-weight="500" fill="#412402" dominant-baseline="central">短期记忆</text>
<text x="52" y="150" font-size="11" fill="#633806" dominant-baseline="central">现状：固定 7 天 TTL，惰性过期</text>
<rect x="400" y="112" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="412" y="132" font-size="13" font-weight="500" fill="#04342C" dominant-baseline="central">长期记忆</text>
<text x="412" y="150" font-size="11" fill="#085041" dominant-baseline="central">LLM 提取 importance≥0.6，永久</text>
<path d="M160 168 L160 192" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#c)"/>
<path d="M520 168 L520 192" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#c)"/>
<text x="168" y="184" font-size="11" fill="#633806">7 天内</text>
<text x="528" y="184" font-size="11" fill="#085041">已沉淀</text>
<rect x="40" y="196" width="240" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="52" y="208" font-size="12" font-weight="500" fill="#412402" dominant-baseline="central">反复提及 → 强化权重</text>
<text x="52" y="226" font-size="11" fill="#633806" dominant-baseline="central">可设计：提及次数累积</text>
<path d="M280 218 L396 218" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#c)"/>
<text x="338" y="210" font-size="11" fill="#0F6E56" text-anchor="middle">升级</text>
<rect x="40" y="252" width="240" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="52" y="264" font-size="12" font-weight="500" fill="#412402" dominant-baseline="central">长期未提 → 衰减淘汰</text>
<text x="52" y="282" font-size="11" fill="#633806" dominant-baseline="central">可设计：遗忘曲线/指数衰减</text>
<rect x="400" y="196" width="240" height="100" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="412" y="216" font-size="12" font-weight="500" fill="#04342C" dominant-baseline="central">升级规则（可设计）</text>
<text x="412" y="238" font-size="11" fill="#085041" dominant-baseline="central">· 7 天内提及 ≥2 次 → 升级</text>
<text x="412" y="258" font-size="11" fill="#085041" dominant-baseline="central">· 与长期记忆去重命中 → 合并</text>
<text x="412" y="278" font-size="11" fill="#085041" dominant-baseline="central">· 用户明确"记住" → 强制沉淀</text>
<rect x="40" y="330" width="600" height="86" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="52" y="350" font-size="13" font-weight="500" fill="#042C53" dominant-baseline="central">会话记忆 — 长对话失忆解法</text>
<text x="52" y="372" font-size="11" fill="#0C447C" dominant-baseline="central">注入 = 早期摘要（压缩）+ 最近 20 条（窗口）</text>
<text x="52" y="392" font-size="11" fill="#0C447C" dominant-baseline="central">摘要异步更新：新摘要 = 摘要(旧摘要 + 新对话)，不阻塞响应</text>
<text x="52" y="406" font-size="11" fill="#185FA5" dominant-baseline="central">关键结论同时被 LLM 提取沉淀到长期层（双保险）</text>
</svg>