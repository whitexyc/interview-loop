<svg viewBox="0 0 680 440" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>min-max 归一化：为何先归一化再融合</title>
<desc>FTS 与向量分数量纲不同，各自 min-max 归一化到 0-1 后才能加权融合；保序不保绝对值</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="28" font-size="14" font-weight="500" fill="#444441">为什么先各自 min-max 归一化？—— 两个通道分数不在一个量级</text>
<g><rect x="40" y="46" width="280" height="96" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="56" y="66" font-size="13" font-weight="500" fill="#412402">FTS 通道（ts_rank）</text><text x="56" y="88" font-size="12" fill="#633806">文档A: 0.004　文档B: 0.002</text><text x="56" y="106" font-size="12" fill="#633806">文档C: 0.006</text><text x="56" y="126" font-size="11" fill="#854F0B">量级很小（10⁻³ 级别）</text></g>
<g><rect x="360" y="46" width="280" height="96" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="376" y="66" font-size="13" font-weight="500" fill="#042C53">向量通道（cosine）</text><text x="376" y="88" font-size="12" fill="#0C447C">文档A: 0.72　文档B: 0.55</text><text x="376" y="106" font-size="12" fill="#0C447C">文档C: 0.90</text><text x="376" y="126" font-size="11" fill="#185FA5">量级较大（0.x 级别）</text></g>
<text x="340" y="168" font-size="12" font-weight="500" text-anchor="middle" fill="#A32D2D">直接加权 = 大数吃小数：0.006 × 0.3 + 0.90 × 0.7 ≈ 0.63，FTS 的贡献被向量淹没</text>
<line x1="180" y1="142" x2="180" y2="180" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="500" y1="142" x2="500" y2="180" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="40" y="186" width="600" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="340" y="208" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#04342C">min-max 归一化：x' = (x - min) / (max - min)</text><text x="340" y="230" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">各自通道独立做：FTS [0.002,0.004,0.006]→[0,0.5,1]　向量 [0.55,0.72,0.90]→[0,0.5,1]</text></g>
<line x1="340" y1="246" x2="340" y2="272" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="40" y="272" width="600" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="340" y="294" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#04342C">同一量纲 [0,1] 后，再按 alpha 加权融合</text><text x="340" y="316" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">hybrid_score = 0.3 × fts_norm + 0.7 × vec_norm（alpha=0.3）</text></g>
<g><rect x="40" y="356" width="600" height="64" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="56" y="376" font-size="12" font-weight="500" fill="#26215C">为什么只关心相对排序？</text><text x="56" y="396" font-size="11" fill="#3C3489">检索只选 top-k——只需要知道"谁比谁更相关"（序），不需要"有多相关"（绝对分）</text><text x="56" y="412" font-size="11" fill="#3C3489">min-max 保序：映射后大小顺序不变，只是数值压到 [0,1]；且对分数分布无假设（z-score 假设正态）</text></g>
</svg>