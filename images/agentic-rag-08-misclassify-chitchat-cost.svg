<svg viewBox="0 0 680 470" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>闲聊误判为 knowledge 的真实成本分析</title>
<desc>闲聊在技术知识库检索为空触发短路，只多花一次检索；最坏情况才走完整链路</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="28" font-size="14" font-weight="500" fill="#444441">闲聊"你好呀"被误判成 knowledge 后，会发生什么？</text>
<g><rect x="40" y="46" width="260" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/><text x="170" y="66" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#501313">误判：intent = knowledge</text><text x="170" y="86" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#A32D2D">本该走闲聊直答，却进了知识库路径</text></g>
<line x1="170" y1="102" x2="170" y2="130" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="40" y="130" width="600" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="340" y="150" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#042C53">步骤 1 · 混合检索（唯一的额外成本 ≈ 0.5s）</text><text x="340" y="170" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">jieba FTS + 向量两路并行查询 → 关键点：闲聊在技术知识库里检索不到内容</text></g>
<g><rect x="40" y="206" width="290" height="96" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="185" y="228" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#04342C">典型情况：检索为空（约 99%）</text><text x="185" y="250" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">docs=[] → rerank 空 → 反思直接返回</text><text x="185" y="266" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">（不调 LLM！check_sufficiency 空文档短路）</text><text x="185" y="286" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">→ 直接 LLM 兜底"知识库暂无相关信息"</text></g>
<g><rect x="350" y="206" width="290" height="96" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="495" y="228" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#412402">最坏情况：命中边缘文档（少见）</text><text x="495" y="250" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#633806">"你是做什么的"匹配到简历文档</text><text x="495" y="266" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#633806">→ 走完整链路：rerank + 反思 + 生成</text><text x="495" y="286" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#633806">≈ 3-5s（端到端延迟）</text></g>
<g><rect x="40" y="330" width="600" height="120" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="56" y="352" font-size="13" font-weight="500" fill="#26215C">结论：话术要分口径说，不能笼统说"只多花半秒"</text><text x="56" y="374" font-size="12" fill="#3C3489">1. 典型（检索为空）：真正多花的只有"一次混合检索"≈0.5s——反思空文档短路不调 LLM</text><text x="56" y="394" font-size="12" fill="#3C3489">2. 最坏（命中边缘文档）：多走完整链路 ≈3-5s——但代价仍是"时间"而非"正确性"</text><text x="56" y="414" font-size="12" fill="#3C3489">3. 对比漏检：闲聊问题被误判走完整链路，答案还能兜底给出（多花时间但答得上）</text><text x="56" y="434" font-size="12" fill="#3C3489">   而知识库问题被漏检成闲聊，直接答非所问（快但错得彻底，无法挽回）</text></g>
</svg>