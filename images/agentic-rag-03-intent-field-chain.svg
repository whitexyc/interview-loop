<svg viewBox="0 0 680 470" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>intent 字段产生链路</title>
<desc>intent 由 LLM 提议 JSON 后经提取解析与白名单校验产生，四个异常路径均回退 knowledge</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="28" font-size="14" font-weight="500" fill="#444441">intent 的产生链路：LLM 提议 → 代码裁决</text>
<g><rect x="210" y="46" width="260" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="340" y="68" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">用户 Query → RouterAgent.classify()</text></g>
<line x1="340" y1="90" x2="340" y2="118" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="210" y="118" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="340" y="138" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#042C53">LLM generate() 返回 JSON 文本</text><text x="340" y="158" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">{"intent", "confidence", "reason"}</text></g>
<line x1="340" y1="174" x2="340" y2="202" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="210" y="202" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="340" y="222" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#042C53">提取 { } 块 + json.loads</text><text x="340" y="242" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">防御 LLM 在 JSON 前后加废话</text></g>
<line x1="340" y1="258" x2="340" y2="286" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="210" y="286" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="340" y="306" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#042C53">intent 白名单校验</text><text x="340" y="326" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">必须是 knowledge / casual_chat / realtime</text></g>
<line x1="340" y1="342" x2="340" y2="370" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="210" y="370" width="260" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="340" y="392" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#04342C">最终 intent（合法值）</text></g>
<g><rect x="40" y="404" width="600" height="52" rx="10" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/><text x="56" y="422" font-size="12" font-weight="500" fill="#A32D2D">四个保守回退口，全部落回 knowledge（宁多检不漏检）</text><text x="56" y="442" font-size="12" fill="#791F1F">空查询 · LLM 调用异常 · JSON 解析失败 · intent 不在白名单</text></g>
</svg>