<svg viewBox="0 0 680 400" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>系统内三类分数/置信度来源对比</title>
<desc>意图路由 confidence 为 LLM 自报仅展示用；verify 置信度为程序计算；hybrid/graph score 为检索相关度</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="28" font-size="14" font-weight="500" fill="#444441">三处"分数"别混淆</text>
<g><rect x="40" y="46" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="130" y="66" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#412402">intent confidence</text><text x="130" y="86" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#854F0B">LLM 自报 · 仅展示</text></g>
<g><rect x="250" y="46" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="340" y="66" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#04342C">overall_confidence</text><text x="340" y="86" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">程序计算 · 真置信度</text></g>
<g><rect x="460" y="46" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="550" y="66" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#042C53">hybrid / graph score</text><text x="550" y="86" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">检索相关度 · 非置信度</text></g>
<line x1="130" y1="102" x2="130" y2="140" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="130" y="160" font-size="12" text-anchor="middle" fill="#2C2C2A">router.py prompt 要求</text>
<text x="130" y="178" font-size="12" text-anchor="middle" fill="#5F5E5A">LLM 返回 0-1 自评数字</text>
<text x="130" y="196" font-size="12" text-anchor="middle" fill="#854F0B">解析失败兜底 0.5</text>
<line x1="340" y1="102" x2="340" y2="140" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="160" font-size="12" text-anchor="middle" fill="#2C2C2A">verify_answer 拆句判定</text>
<text x="340" y="178" font-size="12" text-anchor="middle" fill="#5F5E5A">1 - unsupported / total</text>
<text x="340" y="196" font-size="12" text-anchor="middle" fill="#0F6E56">逐句证据链 · 温度 0</text>
<line x1="550" y1="102" x2="550" y2="140" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="550" y="160" font-size="12" text-anchor="middle" fill="#2C2C2A">alpha 加权 / 命中数归一化</text>
<text x="550" y="178" font-size="12" text-anchor="middle" fill="#5F5E5A">排序用 · 不是可信度</text>
<g><rect x="40" y="228" width="600" height="152" rx="10" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/><text x="56" y="250" font-size="12" font-weight="500" fill="#A32D2D">面试关键认知（被追问"LLM 自报 confidence 可信吗"）</text><text x="56" y="272" font-size="12" fill="#791F1F">1. 它是模型"自我感觉"，不是校准过的概率，不能当阈值用</text><text x="56" y="292" font-size="12" fill="#791F1F">2. 代码里没有任何地方拿它做判断——路由决策只看 intent 字段</text><text x="56" y="312" font-size="12" fill="#791F1F">3. 它只进日志审计 + 前端展示（main.py step 事件透传）</text><text x="56" y="332" font-size="12" fill="#791F1F">4. 真正的程序化置信度在 verify_answer：1 - unsupported/total</text><text x="56" y="352" font-size="12" fill="#791F1F">5. 检索分数 hybrid/graph 是相关度，管排序，跟可信度是两回事</text></g>
</svg>