<svg viewBox="0 0 680 500" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>intent 正确性校验分层方案</title>
<desc>四层方案：离线评测集量化现状、在线二次确认、检索反证、反馈飞轮与终极小模型分类器</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="28" font-size="14" font-weight="500" fill="#444441">intent 正确性校验：四层方案（按成本从低到高）</text>
<g><rect x="40" y="46" width="600" height="92" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="56" y="66" font-size="13" font-weight="500" fill="#042C53">层 1 · 离线评测集（先量化现状，最便宜、必做）</text><text x="56" y="88" font-size="12" fill="#0C447C">扩展 golden 集：补 casual_chat / realtime / 边界易混样本</text><text x="56" y="106" font-size="12" fill="#0C447C">指标：Accuracy + 每类 Precision / Recall / F1 + 混淆矩阵</text><text x="56" y="124" font-size="12" fill="#0C447C">复用 eval_runs 表：eval_type='intent' 版本化回归（改 prompt 即见效果）</text></g>
<line x1="340" y1="138" x2="340" y2="158" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="40" y="158" width="600" height="92" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="56" y="178" font-size="13" font-weight="500" fill="#412402">层 2 · 在线二次确认（只对"跳过检索"决策谨慎）</text><text x="56" y="200" font-size="12" fill="#633806">核心洞察：走 knowledge 是默认低风险；跳过检索才是高风险决策</text><text x="56" y="218" font-size="12" fill="#633806">触发条件：intent≠knowledge 且 confidence 低（单向信任低置信）</text><text x="56" y="236" font-size="12" fill="#633806">二次确认 prompt 再问一次"是否涉及知识库"，确认才允许跳过</text></g>
<line x1="340" y1="250" x2="340" y2="270" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="40" y="270" width="600" height="92" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="56" y="290" font-size="13" font-weight="500" fill="#04342C">层 3 · 检索结果反证（走 knowledge 后的后验校验）</text><text x="56" y="312" font-size="12" fill="#085041">knowledge 路径检索后：top-1 绝对余弦 &lt; 阈值 → 疑似误判</text><text x="56" y="330" font-size="12" fill="#085041">二次分类：query + 检索摘要 一起给 LLM → 判闲聊还是知识库</text><text x="56" y="348" font-size="12" fill="#085041">与 check_sufficiency 同构——反思的"镜像"：从检索侧验证该不该检</text></g>
<line x1="340" y1="362" x2="340" y2="382" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="40" y="382" width="600" height="98" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="56" y="402" font-size="13" font-weight="500" fill="#26215C">层 4 · 反馈飞轮 + 终极方案（长期演进）</text><text x="56" y="424" font-size="12" fill="#3C3489">前端点赞/点踩 → 踩的样本回流评测集做增量标注（数据飞轮）</text><text x="56" y="442" font-size="12" fill="#3C3489">终极：分类任务不一定要 LLM——fine-tune 小分类器</text><text x="56" y="460" font-size="12" fill="#3C3489">（bge-m3 embedding + 逻辑回归 / BERT）→ 概率校准 → 真置信度</text><text x="56" y="478" font-size="12" fill="#3C3489">推理成本低、可量化、输出经过校准的真实概率</text></g>
</svg>