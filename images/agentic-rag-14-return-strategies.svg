<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<text x="40" y="24" font-size="14" font-weight="500" fill="#2C2C2A">子块命中 → 返回什么？</text>
<text x="40" y="44" font-size="12" fill="#5F5E5A">父块含 4 个子块，query 命中子块 B</text>
<rect x="40" y="60" width="600" height="52" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="52" y="76" font-size="12" font-weight="500" fill="#444441">父块（≤4000 字符，完整 section）</text>
<rect x="52" y="86" width="130" height="18" rx="4" fill="#D3D1C7"/>
<rect x="192" y="86" width="130" height="18" rx="4" fill="#1D9E75"/>
<rect x="332" y="86" width="130" height="18" rx="4" fill="#D3D1C7"/>
<rect x="472" y="86" width="130" height="18" rx="4" fill="#D3D1C7"/>
<text x="257" y="95" font-size="11" fill="#04342C" text-anchor="middle" dominant-baseline="central">B 命中</text>
<text x="40" y="140" font-size="13" font-weight="500" fill="#A32D2D">策略 1 · 当前实现：返回整个父块</text>
<rect x="40" y="150" width="600" height="40" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="52" y="170" font-size="12" fill="#501313" dominant-baseline="central">返回 A+B+C+D 全部（≈4000 字）→ 相关只占 1/4~1/13，93% 是无关内容</text>
<text x="40" y="216" font-size="13" font-weight="500" fill="#185FA5">策略 2 · 只返回命中子块 B（为什么不行的答案）</text>
<rect x="40" y="226" width="600" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="52" y="246" font-size="12" fill="#042C53" dominant-baseline="central">子块 B 开头可能是"这种机制……"指代 A 的内容 → 断章取义，LLM 看不懂</text>
<text x="40" y="292" font-size="13" font-weight="500" fill="#0F6E56">策略 3 · 窗口：命中块 + 相邻兄弟块（推荐）</text>
<rect x="40" y="302" width="600" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="52" y="322" font-size="12" fill="#04342C" dominant-baseline="central">返回 A+B（或 B+C）≈600-900 字 → 保住切点上下文，冗余从 13 倍降到 2-3 倍</text>
<rect x="40" y="356" width="600" height="30" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="52" y="371" font-size="12" fill="#412402" dominant-baseline="central">本质：检索粒度（300）与返回粒度（4000）分离设计，返回粒度太粗</text>
</svg>