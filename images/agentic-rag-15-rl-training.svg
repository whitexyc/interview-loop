<svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="24" font-size="14" font-weight="500" fill="#2C2C2A">RL 强化学习 — 专用重写器的训练闭环</text>
<text x="40" y="44" font-size="12" fill="#5F5E5A">没有标准答案，只有"结果好不好"——用结果好坏当信号调参</text>
<rect x="40" y="70" width="280" height="64" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="52" y="92" font-size="13" font-weight="500" fill="#042C53" dominant-baseline="central">① 策略（小模型）</text>
<text x="52" y="114" font-size="11" fill="#0C447C" dominant-baseline="central">生成改写 query（动作）</text>
<rect x="400" y="70" width="240" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="412" y="92" font-size="13" font-weight="500" fill="#04342C" dominant-baseline="central">② 环境（检索+reader）</text>
<text x="412" y="114" font-size="11" fill="#085041" dominant-baseline="central">拿到改写去检索知识库，大模型生成答案</text>
<rect x="400" y="220" width="240" height="64" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="412" y="242" font-size="13" font-weight="500" fill="#412402" dominant-baseline="central">③ 奖励（答案质量）</text>
<text x="412" y="264" font-size="11" fill="#633806" dominant-baseline="central">EM/BLEU/LLM-judge 给答案打分</text>
<rect x="40" y="220" width="280" height="64" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="52" y="242" font-size="13" font-weight="500" fill="#26215C" dominant-baseline="central">④ 更新（策略梯度）</text>
<text x="52" y="264" font-size="11" fill="#3C3489" dominant-baseline="central">答得好 → 强化这次改写；答得差 → 削弱</text>
<path d="M320 102 L396 102" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#d)"/>
<text x="358" y="94" font-size="11" fill="#185FA5" text-anchor="middle">动作</text>
<path d="M520 134 L520 216" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#d)"/>
<text x="530" y="178" font-size="11" fill="#0F6E56">结果</text>
<path d="M400 252 L324 252" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#d)"/>
<text x="362" y="244" font-size="11" fill="#854F0B" text-anchor="middle">打分</text>
<path d="M180 220 L180 138" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#d)"/>
<text x="170" y="182" font-size="11" fill="#534AB7">调整参数</text>
<text x="340" y="320" font-size="12" font-weight="500" fill="#444441" text-anchor="middle">反复循环，直到小模型学会"生成让答案更准的改写"</text>
<rect x="40" y="340" width="600" height="60" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="52" y="360" font-size="12" font-weight="500" fill="#444441" dominant-baseline="central">监督学习 vs 强化学习</text>
<text x="52" y="382" font-size="11" fill="#5F5E5A" dominant-baseline="central">监督学习：有标准答案，抄答案学（改写样例句）。RL：没有标准答案，靠"结果好坏"学（答案准不准）</text>
</svg>