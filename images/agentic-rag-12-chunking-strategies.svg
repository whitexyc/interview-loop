<text x="466" y="176" font-size="13" font-weight="500" fill="#04342C" dominant-baseline="central">父子分块 Parent-child</text>
<text x="466" y="194" font-size="11" fill="#085041" dominant-baseline="central">小块检索大块返回 · 在用</text>
<rect x="454" y="216" width="186" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="466" y="234" font-size="13" font-weight="500" fill="#04342C" dominant-baseline="central">LLM 分块 Agentic</text>
<text x="466" y="252" font-size="11" fill="#085041" dominant-baseline="central">LLM 定切点，最贵</text>
<rect x="454" y="274" width="186" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="466" y="292" font-size="13" font-weight="500" fill="#04342C" dominant-baseline="central">摘要块 Summarize</text>
<text x="466" y="310" font-size="11" fill="#085041" dominant-baseline="central">块配摘要辅助检索</text>
</g>
</svg>