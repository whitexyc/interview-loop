<svg viewBox="0 0 680 430" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>F1 分数与混淆矩阵解释</title>
<desc>混淆矩阵四象限定义 TP FP FN TN，F1 为精确率与召回率的调和平均</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="28" font-size="14" font-weight="500" fill="#444441">F1 是什么：精确率 P 与召回率 R 的调和平均</text>
<text x="56" y="60" font-size="12" fill="#888780">混淆矩阵（行=真实类别，列=预测类别）</text>
<g><rect x="60" y="72" width="270" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="195" y="92" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#444441">预测 = knowledge</text></g>
<g><rect x="330" y="72" width="270" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="465" y="92" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#444441">预测 = casual_chat</text></g>
<g><rect x="60" y="112" width="200" height="72" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="160" y="134" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#04342C">TP（真阳）</text><text x="160" y="156" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">真的 knowledge</text><text x="160" y="172" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">被正确判对 ✓</text></g>
<g><rect x="260" y="112" width="130" height="72" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/><text x="325" y="134" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#501313">FN（假阴）</text><text x="325" y="156" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#A32D2D">真的 knowledge</text><text x="325" y="172" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#A32D2D">被误判成闲聊 ✗</text></g>
<g><rect x="60" y="184" width="130" height="72" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/><text x="125" y="206" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#501313">FP（假阳）</text><text x="125" y="228" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#A32D2D">真的闲聊</text><text x="125" y="244" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#A32D2D">被误判成知识库 ✗</text></g>
<g><rect x="260" y="184" width="130" height="72" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="325" y="206" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#04342C">TN（真阴）</text><text x="325" y="228" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">真的闲聊</text><text x="325" y="244" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">被正确判对 ✓</text></g>
<text x="420" y="150" font-size="13" font-weight="500" fill="#185FA5">精确率 P = TP/(TP+FP)</text>
<text x="420" y="170" font-size="12" fill="#5F5E5A">预测为 knowledge 的里面，</text>
<text x="420" y="186" font-size="12" fill="#5F5E5A">真正是 knowledge 的比例（准不准）</text>
<text x="420" y="216" font-size="13" font-weight="500" fill="#185FA5">召回率 R = TP/(TP+FN)</text>
<text x="420" y="236" font-size="12" fill="#5F5E5A">真的 knowledge 里，被正确</text>
<text x="420" y="252" font-size="12" fill="#5F5E5A">挑出来的比例（全不全）</text>
<text x="420" y="282" font-size="13" font-weight="500" fill="#0F6E56">F1 = 2·P·R/(P+R)</text>
<text x="420" y="302" font-size="12" fill="#5F5E5A">两者调和平均：偏科会被惩罚</text>
<g><rect x="40" y="282" width="340" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="56" y="302" font-size="12" font-weight="500" fill="#412402">为什么用 F1 而不用 Accuracy？</text><text x="56" y="322" font-size="11" fill="#633806">90 条知识库 + 10 条闲聊时，模型全猜 knowledge</text><text x="56" y="338" font-size="11" fill="#633806">Accuracy 也有 90%，但闲聊全漏检——Accuracy 骗人</text></g>
<g><rect x="40" y="358" width="600" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="56" y="378" font-size="12" font-weight="500" fill="#26215C">intent 场景用法：重点盯 knowledge 的 Recall（漏检率）</text><text x="56" y="398" font-size="11" fill="#3C3489">F1 综合衡量"挑得准"和"挑得全"；混淆矩阵看哪两类易混（如 knowledge ↔ casual_chat）</text></g>
</svg>