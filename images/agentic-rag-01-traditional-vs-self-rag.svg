<svg viewBox="0 0 680 460" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>传统 RAG vs Self-RAG 对比</title>
<desc>传统 RAG 检索一次即回答，无反馈回路；Self-RAG 增加反思与二次检索回路</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="28" font-size="14" font-weight="500" fill="#444441">传统 RAG（naive）</text>
<text x="40" y="46" font-size="12" fill="#888780">检索一次就回答，没有反馈回路</text>
<g><rect x="40" y="64" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="110" y="82" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">用户 Query</text><text x="110" y="98" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">语义检索 Top-5</text></g>
<line x1="180" y1="86" x2="220" y2="86" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="220" y="64" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="295" y="82" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">拼 prompt + 文档</text><text x="295" y="98" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">一次性生成</text></g>
<line x1="370" y1="86" x2="410" y2="86" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="410" y="64" width="130" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/><text x="475" y="82" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#501313">输出答案</text><text x="475" y="98" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#A32D2D">检错就答错</text></g>
<g><rect x="40" y="128" width="500" height="76" rx="10" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/><text x="56" y="150" font-size="12" font-weight="500" fill="#A32D2D">两个致命缺陷</text><text x="56" y="170" font-size="12" fill="#791F1F">1. 检索结果不相关 → 答案必错，且无关上下文还会带偏 LLM</text><text x="56" y="190" font-size="12" fill="#791F1F">2. 系统不知道自己"检得不够"——没有感知，就没有纠正</text></g>
<text x="360" y="246" font-size="14" font-weight="500" fill="#444441">Self-RAG（本项目的实现）</text>
<text x="360" y="264" font-size="12" fill="#888780">在生成前加一道"反思闸门"，不够就改写重检</text>
<g><rect x="360" y="282" width="130" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="425" y="300" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#04342C">混合检索</text><text x="425" y="316" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Top-20 召回</text></g>
<line x1="490" y1="304" x2="530" y2="304" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="530" y="282" width="110" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="585" y="300" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#04342C">Rerank</text><text x="585" y="316" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Top-5 精排</text></g>
<line x1="585" y1="326" x2="585" y2="360" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="500" y="360" width="170" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="585" y="380" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#412402">反思检查</text><text x="585" y="398" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#854F0B">够不够回答？</text></g>
<line x1="500" y1="388" x2="440" y2="388" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="470" y="378" font-size="11" fill="#854F0B" text-anchor="end">不足 → 改写 query 重检（最多 3 轮）</text>
<g><rect x="360" y="346" width="110" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="415" y="364" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#04342C">充分 ✓</text><text x="415" y="380" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">带引用生成</text></g>
<line x1="415" y1="390" x2="415" y2="430" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="415" y="446" font-size="12" text-anchor="middle" fill="#2C2C2A">答案 + [1][2] 引用溯源</text>
</svg>