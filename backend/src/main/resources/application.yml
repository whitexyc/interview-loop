server:
  port: 8081

spring:
  application:
    name: personal-website
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:personal_website}?stringtype=unspecified
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}

# JWT 认证配置（module-032）
jwt:
  # 共享密钥（HS256 需 ≥32 字节）；必须用环境变量 APP_JWT_SECRET 提供，无默认值（缺失时 Spring 占位符解析失败 = 启动 fail-fast）。
  # 禁止硬编码默认密钥：env 缺失时回退到公开密钥可伪造任意用户 token、击穿认证与记忆隔离（module-033 Review #1 阻塞）。
  secret: ${APP_JWT_SECRET}
  expire-days: 7

# AI Python 服务地址
ai-service:
  base-url: ${AI_SERVICE_URL:http://localhost:8000}
  connect-timeout: 5s
  read-timeout: 30s

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志级别
logging:
  level:
    com.personalwebsite: DEBUG
    org.springframework.web: INFO
