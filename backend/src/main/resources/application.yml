server:
  port: 8081

spring:
  application:
    name: personal-website
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:personal_website}?stringtype=unspecified
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}

# JWT 认证配置（module-032）
jwt:
  # 共享密钥（HS256 需 ≥32 字节）。
  # 默认值为【本地开发专用占位符】（与 ai_service/.env 的 PW_JWT_SECRET 同值，IDE 一键启动用）。
  # ⚠️ 生产必须设环境变量 APP_JWT_SECRET 覆盖——若未覆盖，JwtUtil 会在启动时检测到占位符并打 WARNING。
  # 禁止把真实生产密钥写进本文件/仓库。
  secret: ${APP_JWT_SECRET:dev-only-local-jwt-secret-0123456789abcdef0123456789abcdef}
  expire-days: 7

# AI Python 服务地址
ai-service:
  base-url: ${AI_SERVICE_URL:http://localhost:8000}
  connect-timeout: 5s
  read-timeout: 30s

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志级别
logging:
  level:
    com.personalwebsite: DEBUG
    org.springframework.web: INFO
