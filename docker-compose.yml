# 基础设施编排：PostgreSQL 16 (pgvector + Apache AGE) + Redis
#
# 范围说明：本文件只负责**依赖服务**。三个应用服务（ai_service / backend /
# frontend）目前在本机直接启动（见 README「快速启动」与 start.ps1），
# 这样改代码不需要重建镜像，迭代更快。
#
# 用法：
#   docker compose up -d           # 起依赖
#   docker compose ps              # 看健康状态
#   docker compose down            # 停（保留数据）
#   docker compose down -v         # 停并清空数据（下次启动会重新执行 initdb）
#
# 首次启动会编译 Apache AGE（约 3-8 分钟，取决于网络与机器），之后走镜像缓存。

services:
  postgres:
    build:
      context: ./docker/postgres
    image: interview-loop-postgres:16-age1.6
    container_name: interview-loop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
      POSTGRES_DB: ${DB_NAME:-personal_website}
      # 中文内容排序/比较更稳；与 ai_service 侧的 UTF-8 假设一致
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-personal_website}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: interview-loop-redis
    restart: unless-stopped
    # 密码与 backend/application.yml 的 spring.data.redis.password 默认值一致
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-123456}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-123456} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
