name: interview-admin-ci

# 出题 / 面试平台（Spring Boot 3.2）的编译与测试。
# monorepo 结构下工作目录是 interview-admin/。
on:
  push:
    branches: [main, master, develop]
    paths:
      - "interview-admin/**"
      - ".github/workflows/interview-admin-ci.yml"
  pull_request:
    paths:
      - "interview-admin/**"
      - ".github/workflows/interview-admin-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Ensure Maven wrapper is executable
        working-directory: interview-admin
        run: chmod +x ./mvnw

      - name: Compile
        working-directory: interview-admin
        run: ./mvnw -B -ntp clean verify -Dmaven.test.skip=true
